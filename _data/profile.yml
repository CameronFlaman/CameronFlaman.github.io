short_bio: >-
  <p>
    My name is Cameron, and I'm a fourth-year undergraduate student studying Physics at McGill. I am a passionate and motivated individual, 
    who finds physics to be an infinitely exciting and rewarding world and seeks to pursue it further as a graduate student. My strengths 
    and greatest interests lie in experimental hardware and instrumentation, I find that I have an exceptionally strong foundation in construction and electronics and can quickly and effectively 
    learn and execute new tools, techniques, and fabrication processes. Programming is also a field I have proficiency in, and have been able to perform
    a variety of software tasks from challenging statistical analysis to developing live computer vision tracking algorithms. I have a deep appreciation
    for the intersection of these skills and theoretical understanding, and seek to apply my skillset to contribute to innovative research within McGill's Physics department.
  </p>
  <p>
    I deeply value my artistic and musical passions, and I find that the cross-over of these ideas with my work in physics to be 
    unexpectedly useful and unbeleivably exciting. As an example, my first exposure to circuitry was building equipment for my electric guitar with 
    my father, who has a background as an electrician. I have continually pursued audio-electronics with a particular interest in
    the elegant, yet crazy world of analog audio processing. This has culminated in my most ambitious ongoing project which is the repair 
    of a 1960s analog jukebox. Another such intersecion has been challenging myself with philosophy courses throughout my undergraduate degree which have honed my
    writing, and critical thinking skills. Furthermore, my academic journey has always been accompanied by some sort of educational or outreach
    aspect. In high school I was a peer tutor and ski instructor, I was also a TEAM mentor for first-year chemistry courses; these experiences have culminated
    in my most recent project, which was to develop a cloud chamber outreach tool motivated and informed by all that I had practically learned
    from these rewarding opportunities. Finally, my background and enjoyment of theatre has made me a confident public presenter 
    and an effective science communicator, so long as it's in iambic pentameter... just kidding. 
  </p>

