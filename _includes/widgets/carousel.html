<div>
    <div id="{{ include.id | slugify }}" class="carousel slide" data-ride="carousel">
        <div class="carousel-indicators">
            {% for item in include.images %}
            <button type="button" data-target="#{{ include.id | slugify }}" data-slide-to="{{ forloop.index0 }}" aria-label="Show slide {{ forloop.index }}" {% if forloop.index == 1 %}class="active"{% endif %}></button>
            {% endfor %}
        </div>
        <div class="carousel-inner" style="height: {{ include.height }};">
            {% for item in include.images %}
            <div class="carousel-item {% if forloop.index == 1 %}active{% endif %}">
                {% if item.link %}<a href="{{ item.link }}" target="_blank">{% endif %}
                <img src="{{ item.src | relative_url }}"
                     class="d-block rounded-xl w-100"
                     alt="{{ item.desc | escape }}"
                     style="height: {{ include.height }}; object-fit: cover;">
                {% if item.link %}</a>{% endif %}
            </div>
            {% endfor %}
        </div>
        <button class="carousel-control-prev" type="button" data-target="#{{ include.id | slugify }}" data-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="sr-only">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-target="#{{ include.id | slugify }}" data-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="sr-only">Next</span>
        </button>
    </div>
    <div id="{{ include.id | slugify }}-description" class="carousel-description" style="padding: 1rem; background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 0.5rem; text-align: center; margin-top: 0.5rem;">
        {% for item in include.images %}
        <div class="description-item" style="display: {% if forloop.index == 1 %}block{% else %}none{% endif %};">
            <p style="margin: 0; color: #333; font-size: 0.95rem;">{{ item.desc }}</p>
        </div>
        {% endfor %}
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const carouselId = '{{ include.id | slugify }}';
    const carousel = document.getElementById(carouselId);
    const descriptionContainer = document.getElementById(carouselId + '-description');
    
    if (carousel && descriptionContainer) {
        carousel.addEventListener('slide.bs.carousel', function(e) {
            const descItems = descriptionContainer.querySelectorAll('.description-item');
            descItems.forEach((item, index) => {
                item.style.display = index === e.to ? 'block' : 'none';
            });
        });
    }
});
</script>
